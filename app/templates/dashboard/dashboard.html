{% extends "appbuilder/base.html" %}

{% block content %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }

        h1{
            text-align: center;
            padding: 20px;
        }

        .top-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .back-btn{
            background: #ff4d4d;
            border: none;
            padding: 10px 15px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .back-btn:hover{
            background: #cc0000;
            transform: scale(1.05);
        }

        .container{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card{
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin: 15px;
            width: 250px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .card:hover{
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        .card h2{
            font-size: 18px;
            color: #ddd;
        }

        .card h3{
            font-size: 28px;
            margin-top: 10px;
            color: #00ffcc;
        }

        .chart-container{
            width: 80%;
            margin: 40px auto;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        canvas{
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn{
            from{opacity:0; transform: translateY(20px);}
            to{opacity:1; transform: translateY(0);}
        }
    </style>
</head>
<body>

    <h1>📊 Dashboard de Reportes</h1>

    <div class="container">
        <div class="card">
            <h2>Total Clientes</h2>
            <h3>{{ total_clientes }}</h3>
        </div>

        <div class="card">
            <h2>Total Órdenes</h2>
            <h3>{{ total_ordenes }}</h3>
        </div>

        <div class="card">
            <h2>Ingresos Totales</h2>
            <h3>Bs {{ ingresos }}</h3>
        </div>
    </div>

    <div class="chart-container">
        <h2 style="text-align:center;">Servicios Más Solicitados</h2>
        <canvas id="grafica"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('grafica');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: {{ labels | tojson }},
                datasets: [{
                    label: 'Cantidad de servicios',
                    data: {{ valores | tojson }},
                    backgroundColor: [
                        '#00ffcc',
                        '#ff4d4d',
                        '#ffd700',
                        '#00bfff',
                        '#ff69b4'
                    ],
                    borderRadius: 8,
                    borderWidth: 1
                }]
            },
            options: {
                responsive:true,
                plugins:{
                    legend:{
                        labels:{
                            color: 'white'
                        }
                    }
                },
                scales: {
                    x: {
                        ticks:{ color:'white' }
                    },
                    y: {
                        beginAtZero: true,
                        ticks:{ color:'white' }
                    }
                }
            }
        });
    </script>

</body>
</html>

{% endblock %}
