{% extends "appbuilder/base.html" %}

{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    background:
        linear-gradient(rgba(7,12,25,.88), rgba(7,12,25,.92)),
        url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
}

.login-wrapper{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.login-card{
    width:100%;
    max-width:430px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:24px;

    padding:45px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.5),
        0 0 80px rgba(0,255,255,.08);

    animation: fadeIn 1s ease;
}

.login-logo{
    text-align:center;
    margin-bottom:20px;
}

.login-logo h1{
    color:white;
    font-size:38px;
    font-weight:700;
    margin:0;
}

.login-logo span{
    color:#00e5ff;
}

.login-logo p{
    color:#94a3b8;
    margin-top:8px;
}

.form-group label{
    color:#cbd5e1;
    font-weight:500;
}

.form-control{
    height:50px;
    border-radius:14px !important;
    border:none !important;

    background: rgba(255,255,255,0.08) !important;
    color:white !important;

    margin-bottom:20px;
}

.form-control:focus{
    box-shadow: 0 0 0 3px rgba(0,229,255,.25) !important;
    background: rgba(255,255,255,0.12) !important;
}

.btn-primary{
    width:100%;
    height:52px;

    border:none !important;

    border-radius:14px !important;

    background: linear-gradient(135deg,#00c6ff,#0072ff) !important;

    font-size:16px;
    font-weight:600;

    transition:.3s;
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,114,255,.45);
}

.alert{
    border-radius:12px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-logo">
            <h1>Servi<span>Tech</span></h1>
            <p>Sistema Inteligente de Gestión Técnica</p>
        </div>

        <form method="post">
            {{ form.hidden_tag() }}

            <div class="form-group">
                <label>Usuario</label>
                {{ form.username(class="form-control") }}
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                {{ form.password(class="form-control") }}
            </div>

            <button type="submit" class="btn btn-primary">
                Ingresar al Sistema
            </button>
        </form>

    </div>

</div>

{% endblock %}
